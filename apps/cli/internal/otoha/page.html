<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Otoha · 工作页</title>
  <style>
    :root{color-scheme:dark;--bg:#141615;--panel:#191c1a;--raised:#202521;--text:#eef0e9;--muted:#a3aba2;--faint:#747f75;--line:#353c35;--accent:#b8cf9f;--accent-ink:#20291c;--selected:#252e23;--warning:#e0bc83;--danger:#f2ad9f;--focus:#c9dfae}
    :root[data-theme="light"]{color-scheme:light;--bg:#f3f3ec;--panel:#eceee5;--raised:#e3e8dc;--text:#22291f;--muted:#596454;--faint:#717b6c;--line:#c9cebf;--accent:#405e31;--accent-ink:#f5f7f0;--selected:#e3ead9;--warning:#865a19;--danger:#a83d29;--focus:#405e31}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,textarea,select{font:inherit}button,select{color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:4px}button,textarea,select{border-radius:6px}button{touch-action:manipulation}svg{display:block}a{color:var(--accent)}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .shell{max-width:1440px;margin:0 auto;padding:0 44px;min-height:100vh;display:flex;flex-direction:column}.topbar{min-height:88px;display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:650;letter-spacing:-1px;line-height:1}.project-picker{display:flex;align-items:center;min-width:0;padding-left:26px;border-left:1px solid var(--line)}select{appearance:auto;background:transparent;border:0;min-width:130px;max-width:340px;padding:9px 28px 9px 0;font-size:14px}.connection{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}.connection-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.connection[data-state="online"] .connection-dot{background:var(--accent)}.connection[data-state="offline"]{color:var(--warning)}.connection[data-state="offline"] .connection-dot{background:var(--warning)}.theme-button{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--muted)}.theme-button:hover{border-color:var(--line);color:var(--text)}
    .notice{margin-top:28px;padding:12px 16px;background:var(--panel);border-left:2px solid var(--warning);color:var(--warning);font-size:13px}.notice code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:64px;padding:57px 0 64px;flex:1;align-items:start}.work{min-width:0}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);margin:0 0 14px}.work-title{font-size:clamp(26px,2.7vw,38px);line-height:1.35;font-weight:570;letter-spacing:-.04em;margin:0 0 18px;overflow-wrap:anywhere}.summary{font-size:16px;color:var(--muted);max-width:760px;margin:0 0 37px;white-space:pre-wrap;overflow-wrap:anywhere}.items{border-top:1px solid var(--line);padding-top:18px}.item{position:relative;display:flex;align-items:center;gap:15px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:19px 15px;color:var(--text);border-radius:0;transition:background .12s}.item:hover{background:var(--panel)}.item[aria-pressed="true"]{background:var(--selected);border-radius:4px;border-bottom-color:transparent}.item[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--accent);border-radius:2px}.item-number{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);min-width:22px}.item-title{font-size:15px;font-weight:520;flex:1;overflow-wrap:anywhere}.item-status{font-size:12px;color:var(--muted);max-width:120px;text-align:right;overflow-wrap:anywhere}.item[aria-pressed="true"] .item-status{color:var(--accent)}.item-arrow{color:var(--faint);flex-shrink:0}.detail{margin-top:32px;min-height:130px}.detail h2{font-size:18px;line-height:1.5;font-weight:560;margin:0 0 11px;overflow-wrap:anywhere}.detail p{margin:0;color:var(--muted);font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.empty-work{min-height:240px;display:flex;flex-direction:column;justify-content:center}.empty-work .work-title{font-size:27px}.empty-work .summary{font-size:14px}.feedback-panel{border-left:1px solid var(--line);padding-left:32px;min-width:0;position:sticky;top:30px}.feedback-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.feedback-heading h2{font-size:20px;font-weight:560;margin:0}.feedback-count{color:var(--faint);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.feedback-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.feedback-input{display:block;width:100%;resize:vertical;min-height:132px;max-height:360px;padding:12px 13px;background:var(--panel);border:1px solid var(--line);color:var(--text);line-height:1.7}.feedback-input::placeholder{color:var(--faint)}.form-context{font-size:11px;color:var(--faint);margin:9px 0 13px;line-height:1.6;overflow-wrap:anywhere}.form-context[data-stale="true"]{color:var(--warning)}.submit-row{display:flex;align-items:center;gap:12px}.send-button{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:9px 17px;font-size:13px;font-weight:600;min-height:40px}.send-button:not(:disabled):hover{filter:brightness(1.06)}.shortcut{font-size:10px;color:var(--faint);margin-left:auto;white-space:nowrap}.form-message{font-size:12px;color:var(--muted);min-height:20px;margin:13px 0 0;overflow-wrap:anywhere}.form-message[data-tone="error"]{color:var(--danger)}.form-message[data-tone="pending"]{color:var(--warning)}.feedback-list{border-top:1px solid var(--line);margin-top:28px}.feedback-entry{padding:17px 0;border-bottom:1px solid var(--line)}.feedback-meta{display:flex;gap:10px;justify-content:space-between;color:var(--faint);font-size:11px;margin-bottom:7px}.feedback-author{max-width:65%;overflow-wrap:anywhere}.feedback-body{margin:0;font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.feedback-version{color:var(--faint);font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:9px}.feedback-empty{font-size:12px;color:var(--faint);padding-top:18px}.footer{border-top:1px solid var(--line);padding:18px 0 22px;color:var(--faint);font-size:11px;display:flex;gap:16px;flex-wrap:wrap}.footer span+span::before{content:"·";margin-right:16px}.footer code{font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.pending-line{color:var(--warning)}.team-empty{display:block;font-size:13px;color:var(--muted)}
    @media(max-width:1100px){.shell{padding:0 30px}.content{gap:36px;grid-template-columns:minmax(0,1fr) 290px}.feedback-panel{padding-left:25px}.topbar{gap:18px}.project-picker{padding-left:18px}.shortcut{display:none}}
    @media(max-width:760px){.shell{padding:0 21px}.topbar{min-height:74px;gap:15px;flex-wrap:wrap}.brand{font-size:20px}.project-picker{padding-left:15px;flex:1}select{max-width:calc(100vw - 180px);min-width:80px;font-size:13px}.connection{order:4;width:100%;margin:0;padding-bottom:12px;font-size:11px;margin-top:-10px}.theme-button{width:34px;height:34px}.content{display:block;padding-top:34px}.work-title{font-size:28px}.summary{font-size:14px;margin-bottom:28px}.feedback-panel{position:static;border-left:0;border-top:1px solid var(--line);padding:29px 0 0;margin-top:37px}.detail{min-height:80px}.item{padding:17px 10px;gap:10px}.item-title{font-size:14px}.item-status{font-size:11px;max-width:90px}.feedback-input{min-height:110px}.footer{font-size:10px;gap:8px}.footer span+span::before{margin-right:8px}.notice{margin-top:18px}.feedback-list{margin-top:22px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    .shell.artifact-mode{max-width:none;height:100dvh;min-height:480px}.artifact-mode .topbar,.artifact-mode .footer{flex-shrink:0}.artifact{flex:1;min-height:0;display:flex;margin:0 -44px}.artifact-frame{display:block;flex:1;width:100%;height:100%;min-height:0;border:0;background:#fff}
    @media(max-width:1100px){.artifact{margin:0 -30px}}@media(max-width:760px){.artifact{margin:0 -21px}}
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <span class="brand" aria-label="Otoha">Otoha<span style="color:var(--accent)">.</span></span>
      <div class="project-picker">
        <label for="team" class="sr-only">项目</label>
        <select id="team" aria-label="项目"><option value="">正在载入项目…</option></select>
      </div>
      <div class="connection" id="connection" data-state="connecting" role="status"><span class="connection-dot" aria-hidden="true"></span><span id="connectionText">正在连接</span></div>
      <button class="theme-button" id="theme" type="button" aria-label="切换到浅色主题" title="切换到浅色主题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>
    <div class="notice" id="notice" role="status" hidden></div>
    <main class="content" id="workLayout">
      <section class="work" aria-labelledby="workTitle">
        <p class="eyebrow">当前工作</p>
        <div id="workHeader" class="empty-work"><h1 class="work-title" id="workTitle">正在载入工作页</h1><p class="summary" id="summary"></p></div>
        <div class="items" id="items" aria-label="工作项" hidden></div>
        <article class="detail" id="detail" aria-labelledby="detailTitle" hidden><h2 id="detailTitle"></h2><p id="detailText"></p></article>
      </section>
      <aside class="feedback-panel" aria-labelledby="feedbackTitle">
        <div class="feedback-heading"><h2 id="feedbackTitle">反馈</h2><span class="feedback-count" id="feedbackCount"></span></div>
        <form id="feedbackForm">
          <label class="feedback-label" for="feedbackText">想调整什么？</label>
          <textarea class="feedback-input" id="feedbackText" maxlength="10000" placeholder="写下你的判断或问题…" disabled></textarea>
          <p class="form-context" id="feedbackContext">等待工作页</p>
          <button class="theme-button" id="restoreDraft" type="button" style="width:auto;height:auto;padding:6px 0;margin:0 0 12px;font-size:12px;color:var(--accent)" hidden>关联当前版本</button>
          <div class="submit-row"><button class="send-button" id="send" type="submit" disabled>发送反馈</button><span class="shortcut" aria-hidden="true">⌘ / Ctrl ↵</span></div>
          <p class="form-message" id="formMessage" aria-live="polite"></p>
        </form>
        <div class="feedback-list" id="feedbackList"></div>
        <p class="feedback-empty" id="feedbackEmpty">还没有反馈</p>
      </aside>
    </main>
    <main class="artifact" id="artifact" aria-label="Agent 工作页" hidden></main>
    <footer class="footer"><span id="source">本地工作页</span><span id="revision" hidden></span><span id="sync" hidden></span><span id="pending" class="pending-line" hidden></span></footer>
  </div>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const ui = Object.fromEntries(['shell','workLayout','artifact','team','connection','connectionText','theme','notice','workHeader','workTitle','summary','items','detail','detailTitle','detailText','feedbackText','feedbackContext','restoreDraft','feedbackForm','feedbackCount','feedbackList','feedbackEmpty','send','formMessage','source','revision','sync','pending'].map(id => [id,$(id)]));
    const safeGet = (store,key) => { try { return store.getItem(key); } catch (_) { return null; } };
    const safeSet = (store,key,value) => { try { if(value === null) store.removeItem(key); else store.setItem(key,value); } catch (_) {} };
    const parse = value => { try { return JSON.parse(value); } catch (_) { return null; } };
    const short = value => String(value || '').slice(0,8);
    const params = new URLSearchParams(location.hash.replace(/^#/,''));
    let team = params.get('team') || new URL(location.href).searchParams.get('team') || safeGet(sessionStorage,'otoha-page-team') || '';
    let state = null, authenticated = false, submitting = false, timer = null, teamVersion = 0, pollRunning = false, pollAgain = false;
    let selected = '', itemFingerprint = '', feedbackFingerprint = '', lastAttempt = null, draftTarget = '', draftMessageID = 0, draftNeedsReview = false, awaitingFeedback = null;
    let artifactView = null;
    const nodeCache = new Map();
    const draftKey = () => 'otoha-page-draft:' + team;
    const selectionKey = () => 'otoha-page-selection:' + team;
    const requestID = () => globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : 'page-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    const validMessageID = value => Number.isSafeInteger(value) && value > 0;
    const revisionLabel = (request,messageID) => validMessageID(messageID) ? '#'+messageID+' · '+short(request) : '来源版本未记录';
    function setText(node,text) { const value=String(text ?? ''); if(node.textContent !== value) node.textContent=value; }
    function theme(value) { document.documentElement.dataset.theme=value; safeSet(localStorage,'otoha-page-theme',value); const label=value==='dark'?'切换到浅色主题':'切换到深色主题'; ui.theme.setAttribute('aria-label',label);ui.theme.title=label; }
    theme(safeGet(localStorage,'otoha-page-theme') === 'light' ? 'light' : 'dark');
    ui.theme.addEventListener('click',() => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    function message(text,tone='') { setText(ui.formMessage,text);ui.formMessage.dataset.tone=tone; }
    function notice(text) { setText(ui.notice,text);ui.notice.hidden=!text; }
    function connect(value,text) { ui.connection.dataset.state=value;setText(ui.connectionText,text || ({online:'已连接',offline:'离线 · 等待续接',connecting:'正在连接'}[value]) || value); }
    function saveDraft() { safeSet(localStorage,draftKey(),JSON.stringify({text:ui.feedbackText.value,page_request_id:draftTarget,page_message_id:draftMessageID,attempt:lastAttempt})); }
    function restoreDraft() {
      const draft=parse(safeGet(localStorage,draftKey())) || parse(safeGet(sessionStorage,draftKey())) || {};
      ui.feedbackText.value=typeof draft.text==='string'?draft.text:'';
      draftTarget=typeof draft.page_request_id==='string'?draft.page_request_id:'';
      draftMessageID=validMessageID(draft.page_message_id)?draft.page_message_id:0;
      draftNeedsReview=Boolean(ui.feedbackText.value.trim() && (!draftTarget || !draftMessageID));
      lastAttempt=draft.attempt && draft.attempt.team===team && validMessageID(draft.attempt.page_message_id)?draft.attempt:null;
      const choice=parse(safeGet(sessionStorage,selectionKey()));
      selected=choice && typeof choice.item_id==='string' && validMessageID(choice.page_message_id)?choice.item_id:'';
    }
    function formState() {
      const pageID=state && state.page && state.page.request_id;
      const pageMessageID=state && state.page && state.page.message_id;
      ui.feedbackText.disabled=!authenticated || !pageID || submitting;
      ui.send.disabled=!authenticated || !pageID || !validMessageID(pageMessageID) || draftNeedsReview || submitting || !ui.feedbackText.value.trim();
      ui.restoreDraft.hidden=!draftNeedsReview;
      ui.restoreDraft.disabled=!authenticated || !pageID || !validMessageID(pageMessageID) || submitting;
      setText(ui.send,submitting?'正在保存…':lastAttempt?'核对并重试':'发送反馈');
      const target=draftTarget || pageID;
      const targetMessageID=draftMessageID || pageMessageID;
      const stale=Boolean(target && pageID && (target!==pageID || targetMessageID!==pageMessageID));
      ui.feedbackContext.dataset.stale=String(stale);
      setText(ui.feedbackContext,draftNeedsReview?'旧草稿未记录来源版本。请核对内容后关联当前版本。':!target?'等待工作页':stale?'页面已更新；这条草稿仍针对版本 '+revisionLabel(target,targetMessageID):'针对版本 '+revisionLabel(target,targetMessageID));
    }
    async function api(path,options={}) {
      const headers={Accept:'application/json',...(options.body ? {'Content-Type':'application/json'} : {}),...(options.headers || {})};
      const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);
      try {
        const response=await fetch(path,{...options,headers,credentials:'same-origin',cache:'no-store',signal:controller.signal});
        let body={};try { body=await response.json(); } catch (_) {}
        if(!response.ok) { const error=new Error(typeof body.error==='string'?body.error:body.error && body.error.message || body.message || '本地服务返回 '+response.status);error.status=response.status;throw error; }
        return body;
      } finally {clearTimeout(timeout);}
    }
    function clearArtifact() {
      if(artifactView){artifactView.dispose();artifactView=null;}
      ui.artifact.replaceChildren();
    }
    function renderArtifact(page,doc,data) {
      const key=JSON.stringify([team,page.request_id,page.message_id]);
      if(artifactView && artifactView.key===key){artifactView.update(data);return;}
      clearArtifact();
      const source={team,page_request_id:page.request_id,page_message_id:page.message_id};
      const frame=document.createElement('iframe');frame.className='artifact-frame';
      frame.setAttribute('sandbox','allow-scripts allow-forms');frame.setAttribute('title',doc.title || 'Agent 工作页');
      frame.setAttribute('referrerpolicy','no-referrer');frame.dataset.pageMessageId=String(page.message_id);
      const requests=new Map();let alive=true;
      function reply(id,stage,error) {
        if(!alive || !frame.isConnected || !frame.contentWindow)return;
        frame.contentWindow.postMessage({type:'otoha:feedback-result',request_id:id,state:stage,...(error?{error:String(error)}:{})},'*');
      }
      async function onMessage(event) {
        if(!alive || event.source!==frame.contentWindow)return;
        const input=event.data;
        if(!input || typeof input!=='object' || Array.isArray(input) || input.type!=='otoha:feedback')return;
        const id=input.request_id===undefined?requestID():input.request_id;
        if(typeof id!=='string' || !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$/.test(id)){reply(null,'rejected','request_id 格式无效');return;}
        if(typeof input.text!=='string' || !input.text.trim() || input.text.length>10000){reply(id,'rejected','反馈须为 1–10000 字符的文本');return;}
        if(!authenticated){reply(id,'rejected','本地工作页尚未连接');return;}
        const payload={...source,request_id:id,text:input.text.trim()};
        const previous=requests.get(id);
        if(previous && previous.payload.text!==payload.text){reply(id,'rejected','同一请求 ID 已关联其他反馈');return;}
        const tracked=previous || {payload,state:'submitting'};requests.set(id,tracked);
        try {
          let result=null;
          try {result=await api('/api/operations?team='+encodeURIComponent(source.team)+'&id='+encodeURIComponent(id));}catch(error){if(error.status!==404)throw error;}
          if(result && (result.request_id!==id || result.page_message_id!==source.page_message_id || result.page_request_id!==source.page_request_id)){reply(id,'rejected','原请求关联的页面版本不同');return;}
          if(!result || !['queued','accepted','needs_attention'].includes(result.state))result=await api('/api/feedback',{method:'POST',body:JSON.stringify(payload)});
          tracked.state=result.state || 'queued';reply(id,tracked.state,result.last_error);if(alive)poll();
        } catch(error) {
          const rejected=[400,401,403,409,413].includes(error.status);tracked.state=rejected?'rejected':'unknown';
          reply(id,tracked.state,rejected?error.message:'暂未确认保存结果；重试请沿用同一请求 ID');
        }
      }
      const update=current=>{
        for(const [id,tracked] of requests){
          const accepted=(current.feedback || []).some(value=>value.request_id===id && value.page_request_id===source.page_request_id && value.page_message_id===source.page_message_id);
          const pending=(current.pending || []).find(value=>value.request_id===id && value.page_message_id===source.page_message_id);
          const next=accepted?'accepted':pending && pending.state==='needs_attention'?'needs_attention':null;
          if(next && tracked.state!==next){tracked.state=next;reply(id,next,pending && pending.last_error);}
        }
      };
      window.addEventListener('message',onMessage);
      artifactView={key,frame,update,dispose:()=>{alive=false;window.removeEventListener('message',onMessage);requests.clear();}};
      ui.artifact.append(frame);frame.srcdoc=doc.html;update(data);
    }
    function authRequired() { authenticated=false;connect('offline','尚未连接本地服务');notice('请通过 otoha page open 打开这张工作页。');formState(); }
    async function initSession() {
      const token=params.get('token');
      if(token) {
        const clean=new URL(location.href);clean.hash='';if(team) clean.searchParams.set('team',team);history.replaceState(null,'',clean);
        await api('/api/session',{method:'POST',headers:{Authorization:'Bearer '+token},body:'{}'});
      }
      await loadTeams();authenticated=true;
    }
    async function loadTeams() {
      const data=await api('/api/teams');
      const teams=(Array.isArray(data.teams)?data.teams:[]).map(value=>typeof value==='string'?{name:value}:value).filter(value=>value && typeof value.name==='string');
      ui.team.replaceChildren();
      if(!teams.length) { const option=document.createElement('option');option.value='';option.textContent='尚未接入项目';ui.team.append(option);team='';ui.team.disabled=true;return; }
      if(!teams.some(value=>value.name===team)) team=teams[0].name;
      for(const value of teams) { const option=document.createElement('option');option.value=value.name;option.textContent=value.project || value.name;ui.team.append(option); }
      ui.team.value=team;ui.team.disabled=false;safeSet(sessionStorage,'otoha-page-team',team);restoreDraft();
      const clean=new URL(location.href);clean.searchParams.set('team',team);history.replaceState(null,'',clean);
    }
    function itemID(item,index) { return String(item.id || item.title || index); }
    const statusLabel = value => ({ready:'就绪',done:'已完成',completed:'已完成',running:'进行中',in_progress:'进行中',pending:'待处理',queued:'待同步',blocked:'需处理',todo:'待开始'}[value] || String(value || ''));
    function renderItems(items) {
      const fingerprint=JSON.stringify(items);
      if(!items.some((item,index)=>itemID(item,index)===selected)) selected=items.length?itemID(items[0],0):'';
      if(fingerprint!==itemFingerprint) {
        itemFingerprint=fingerprint;
        const keep=new Set();
        items.forEach((item,index)=>{
          const id=itemID(item,index);keep.add(id);let button=nodeCache.get(id);
          if(!button) {
            button=document.createElement('button');button.type='button';button.className='item';button.setAttribute('role','button');button.setAttribute('aria-controls','detail');
            const number=document.createElement('span');number.className='item-number';number.setAttribute('aria-hidden','true');
            const title=document.createElement('span');title.className='item-title';
            const status=document.createElement('span');status.className='item-status';
            const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 16 16');arrow.setAttribute('width','15');arrow.setAttribute('height','15');arrow.setAttribute('class','item-arrow');arrow.setAttribute('aria-hidden','true');
            const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','m6 4 4 4-4 4');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.2');arrow.append(path);
            button.append(number,title,status,arrow);button.addEventListener('click',()=>{selected=id;renderSelection();});nodeCache.set(id,button);
          }
          setText(button.children[0],String(index+1).padStart(2,'0'));setText(button.children[1],item.title || id);setText(button.children[2],statusLabel(item.status));
          button.setAttribute('aria-label','查看 '+String(item.title || id)+' 详情'+(item.status?'，状态：'+statusLabel(item.status):''));
          const desired=ui.items.children[index];if(desired!==button) ui.items.insertBefore(button,desired || null);
        });
        for(const [id,button] of nodeCache) if(!keep.has(id)){button.remove();nodeCache.delete(id);}
      }
      ui.items.hidden=!items.length;renderSelection();
    }
    function renderSelection() {
      const items=state && state.page && state.page.document && Array.isArray(state.page.document.items)?state.page.document.items:[];
      for(const [id,button] of nodeCache) button.setAttribute('aria-pressed',String(id===selected));
      const item=items.find((value,index)=>itemID(value,index)===selected);
      ui.detail.hidden=!item;
      if(item){setText(ui.detailTitle,item.title || selected);setText(ui.detailText,item.detail || '暂无补充说明');safeSet(sessionStorage,selectionKey(),JSON.stringify({item_id:selected,page_request_id:state.page.request_id,page_message_id:state.page.message_id}));}
    }
    function renderFeedback(values) {
      const fingerprint=JSON.stringify(values);if(fingerprint===feedbackFingerprint)return;feedbackFingerprint=fingerprint;
      ui.feedbackList.replaceChildren();
      for(const value of values.slice().reverse().slice(0,40)) {
        const article=document.createElement('article');article.className='feedback-entry';
        const meta=document.createElement('div');meta.className='feedback-meta';
        const actor=document.createElement('span');actor.className='feedback-author';actor.textContent=value.actor || (value.source==='agent'?'Agent':'反馈');
        const accepted=document.createElement('span');accepted.textContent='已同步';meta.append(actor,accepted);
        const body=document.createElement('p');body.className='feedback-body';body.textContent=value.text || '';
        const revision=document.createElement('div');revision.className='feedback-version';revision.textContent='版本 '+revisionLabel(value.page_request_id,value.page_message_id);revision.title=String(value.page_message_id || '')+' / '+(value.page_request_id || '');
        article.append(meta,body,revision);ui.feedbackList.append(article);
      }
      ui.feedbackEmpty.hidden=values.length>0;setText(ui.feedbackCount,values.length?String(values.length):'');
    }
    function render(data) {
      state=data;const page=data.page || {};const doc=page.document || {};
      connect(data.connection || 'connecting');
      const hasPage=Boolean(page.request_id && validMessageID(page.message_id));
      const htmlMode=hasPage && doc.format==='html' && typeof doc.html==='string';
      ui.shell.classList.toggle('artifact-mode',htmlMode);ui.workLayout.hidden=htmlMode;ui.artifact.hidden=!htmlMode;
      if(htmlMode)renderArtifact(page,doc,data);else if(artifactView)clearArtifact();
      ui.workHeader.classList.toggle('empty-work',!hasPage);
      setText(ui.workTitle,hasPage?doc.title || '工作页':'等待 Agent 发布工作页');
      setText(ui.summary,hasPage?doc.summary || '':'接入已保留。Agent 发布的工作会出现在这里。');
      renderItems(Array.isArray(doc.items)?doc.items:[]);renderFeedback(Array.isArray(data.feedback)?data.feedback:[]);
      setText(ui.source,data.team || team || '本地工作页');
      ui.revision.hidden=!hasPage;setText(ui.revision,'版本 '+revisionLabel(page.request_id,page.message_id));ui.revision.title=String(page.message_id || '')+' / '+(page.request_id || '');
      ui.sync.hidden=!Number.isFinite(data.cursor);setText(ui.sync,'同步位置 '+(data.cursor || 0));
      const pending=Array.isArray(data.pending)?data.pending:[];
      const attention=pending.filter(value=>value.state==='needs_attention');
      ui.pending.hidden=!pending.length;setText(ui.pending,attention.length?attention.length+' 项需要处理':pending.length+' 项待同步');
      notice(attention.length ? (attention[0].last_error || '有操作未能同步，请让 Agent 查看 otoha page operation。') : '');
      if(lastAttempt && (data.feedback || []).some(value=>value.request_id===lastAttempt.request_id && value.page_message_id===lastAttempt.page_message_id)) {
        if(ui.feedbackText.value.trim()===lastAttempt.text){ui.feedbackText.value='';draftTarget='';draftMessageID=0;draftNeedsReview=false;}
        lastAttempt=null;message('反馈已同步。');saveDraft();
      }
      if(awaitingFeedback && (data.feedback || []).some(value=>value.request_id===awaitingFeedback.request_id && value.page_message_id===awaitingFeedback.page_message_id)) {awaitingFeedback=null;message('反馈已同步。');}
      formState();
    }
    async function poll() {
      if(pollRunning){pollAgain=true;return;}
      pollRunning=true;
      clearTimeout(timer);const version=teamVersion;
      try {
        if(!authenticated) { await initSession(); if(version!==teamVersion)return; }
        if(team) { const data=await api('/api/state?team='+encodeURIComponent(team));if(version===teamVersion)render(data); }
        else { setText(ui.workTitle,'尚未接入项目');setText(ui.summary,'完成 otoha team join 后，工作页会出现在这里。');connect('connecting','等待项目');formState(); }
      } catch(error) {
        if(version!==teamVersion)return;
        if(error.status===401 || error.status===403) authRequired();
        else {connect('offline','本地服务暂不可达');notice('正在等待本地服务恢复。当前内容和反馈草稿已保留。');}
      } finally {pollRunning=false;const delay=pollAgain?0:document.hidden?8000:1500;pollAgain=false;timer=setTimeout(poll,delay);}
    }
    ui.team.addEventListener('change',()=>{saveDraft();clearArtifact();ui.shell.classList.remove('artifact-mode');ui.workLayout.hidden=false;ui.artifact.hidden=true;team=ui.team.value;teamVersion++;safeSet(sessionStorage,'otoha-page-team',team);state=null;selected='';awaitingFeedback=null;itemFingerprint='';feedbackFingerprint='';nodeCache.clear();ui.items.replaceChildren();ui.feedbackList.replaceChildren();ui.workHeader.classList.add('empty-work');setText(ui.workTitle,'正在载入工作页');setText(ui.summary,'');ui.items.hidden=true;ui.detail.hidden=true;message('');restoreDraft();const clean=new URL(location.href);clean.searchParams.set('team',team);history.replaceState(null,'',clean);formState();poll();});
    ui.feedbackText.addEventListener('input',()=>{
      if(!draftNeedsReview && !draftTarget && ui.feedbackText.value.trim()){draftTarget=state && state.page && state.page.request_id || '';draftMessageID=state && state.page && state.page.message_id || 0;}
      if(!ui.feedbackText.value.trim()){draftTarget='';draftMessageID=0;draftNeedsReview=false;}
      lastAttempt=null;saveDraft();formState();
    });
    ui.restoreDraft.addEventListener('click',()=>{if(!state || !state.page || !validMessageID(state.page.message_id))return;draftTarget=state.page.request_id;draftMessageID=state.page.message_id;draftNeedsReview=false;lastAttempt=null;saveDraft();message('草稿已关联当前版本，请确认后发送。');formState();ui.feedbackText.focus();});
    ui.feedbackText.addEventListener('keydown',event=>{if((event.metaKey || event.ctrlKey) && event.key==='Enter' && !ui.send.disabled){event.preventDefault();ui.feedbackForm.requestSubmit();}});
    ui.feedbackForm.addEventListener('submit',async event=>{
      event.preventDefault();if(submitting || draftNeedsReview || !ui.feedbackText.value.trim() || !state || !validMessageID(state.page.message_id))return;
      const activeTeam=team;
      if(!lastAttempt) lastAttempt={team,request_id:requestID(),page_request_id:draftTarget || state.page.request_id,page_message_id:draftMessageID || state.page.message_id,text:ui.feedbackText.value.trim()};
      const attempt=lastAttempt;saveDraft();submitting=true;message('正在保存到本机…');formState();
      try {
        let result=null;
        try {result=await api('/api/operations?team='+encodeURIComponent(team)+'&id='+encodeURIComponent(attempt.request_id));}catch(error){if(error.status!==404)throw error;}
        if(result && (result.request_id!==attempt.request_id || result.page_message_id!==attempt.page_message_id || result.page_request_id!==attempt.page_request_id)) {message('原请求关联的页面版本不同，请让 Agent 核对。草稿已保留。','error');return;}
        if(!result || !['queued','accepted','needs_attention'].includes(result.state)) result=await api('/api/feedback',{method:'POST',body:JSON.stringify(attempt)});
        if(activeTeam!==team)return;
        if(result.state==='needs_attention') {message(result.last_error || '反馈已保留，需要处理同步问题。','error');}
        else {
          ui.feedbackText.value='';draftTarget='';draftMessageID=0;draftNeedsReview=false;lastAttempt=null;awaitingFeedback=result.state==='accepted'?null:{request_id:attempt.request_id,page_message_id:attempt.page_message_id};safeSet(localStorage,draftKey(),null);safeSet(sessionStorage,draftKey(),null);
          message(result.state==='accepted'?'反馈已同步。':'已保存到本机，等待同步。',result.state==='accepted'?'':'pending');
        }
        poll();
      } catch(error) {
        if(activeTeam===team){
          if([400,401,403,409,413].includes(error.status)) message('反馈未能提交：'+error.message+'。草稿和原请求 ID 已保留。','error');
          else message('暂未确认保存结果，草稿已保留。重试会沿用同一请求。','error');
          saveDraft();
        }
      }
      finally {submitting=false;formState();}
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
    restoreDraft();poll();
  })();
  </script>
</body>
