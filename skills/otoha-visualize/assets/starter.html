<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>__PAGE_TITLE__</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('otoha-visualize-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17191a; --fg: #eeefea; --muted: #b2b7b5;
      --line: #454b49; --surface: #222625; --accent: #c5dfcf;
      font: 17px/1.65 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--fg);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #faf9f5; --fg: #202725; --muted: #56625c;
      --line: #aeb8b2; --surface: #f0f1eb; --accent: #24533e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-underline-offset: .2em; }
    button { color: inherit; font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .skip { position: absolute; left: 1rem; top: -6rem; padding: .6rem 1rem; background: var(--surface); }
    .skip:focus { top: 1rem; }
    header, main { max-width: 66rem; margin: auto; padding-inline: clamp(1.1rem, 4vw, 3rem); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.2rem; }
    .page-name { font-size: .85rem; letter-spacing: .03em; }
    #theme { flex: 0 0 auto; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: .35rem .8rem; }
    main { padding-block: clamp(2rem, 6vw, 5rem); }
    h1 { max-width: 18em; margin: 0 0 1rem; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.15; letter-spacing: -.035em; }
    p { max-width: 42rem; margin: 0 0 1.4rem; }
    .muted { color: var(--muted); }
    .example { margin-block: 3rem; padding-block: 1.4rem; border-block: 1px solid var(--line); }
    .example h2 { margin: 0 0 1.5rem; font-size: 1.2rem; }
    .steps { padding: 0; margin: 0 0 1.8rem; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .steps button { width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: .3rem; padding: .8rem; }
    .steps button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
    .steps span { display: block; color: var(--muted); font-size: .8rem; }
    #stage-title { font-size: 1.5rem; margin: 0 0 .5rem; }
    #stage-text { margin: 0; min-height: 3.4em; }
    details { max-width: 42rem; font-size: .9rem; }
    summary { cursor: pointer; width: fit-content; }
    details p { margin-top: 1rem; }
    @media (max-width: 480px) {
      .steps { grid-template-columns: 1fr; }
      .steps button { padding: .65rem .8rem; }
      .steps span { display: inline; margin-right: .8rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      button { transition: background-color .15s ease, border-color .15s ease; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <header>
    <span class="page-name">可视化工作页</span>
    <button id="theme" type="button">浅色</button>
  </header>
  <!-- 可选起点：自由替换整个 main、样式与交互，不必保留本示例的布局。 -->
  <main id="content">
    <h1>__PAGE_TITLE__</h1>
    <p>让一个过程可以逐步查看，判断每一步改变了什么。</p>
    <section class="example" aria-labelledby="example-title">
      <h2 id="example-title">图书入库 · 虚构示例</h2>
      <ol class="steps" aria-label="选择入库阶段">
        <li><button type="button" data-stage="0" aria-pressed="true" aria-controls="stage"><span>01</span>登记</button></li>
        <li><button type="button" data-stage="1" aria-pressed="false" aria-controls="stage"><span>02</span>核对</button></li>
        <li><button type="button" data-stage="2" aria-pressed="false" aria-controls="stage"><span>03</span>上架</button></li>
      </ol>
      <div id="stage" aria-live="polite" aria-atomic="true">
        <h3 id="stage-title">建立图书记录</h3>
        <p id="stage-text">记录书名与数量。此时图书尚未成为可借阅库存。</p>
      </div>
    </section>
    <details>
      <summary>示例范围</summary>
      <p class="muted">以上为虚构流程，按钮只切换说明，没有连接图书系统。制作实际页面时，用任务内容替换此处；原话、来源与尚未确认的理解可按需就地展开。</p>
    </details>
  </main>
  <script>
    const themeButton = document.querySelector('#theme');
    function updateThemeButton() {
      const next = document.documentElement.dataset.theme === 'dark' ? '浅色' : '深色';
      themeButton.textContent = next;
      themeButton.setAttribute('aria-label', `切换到${next}主题`);
    }
    themeButton.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('otoha-visualize-theme', next); } catch {}
      updateThemeButton();
    });
    updateThemeButton();

    const stages = [
      ['建立图书记录', '记录书名与数量。此时图书尚未成为可借阅库存。'],
      ['核对实物与记录', '确认数量和版本一致。发现差异时回到登记阶段修订。'],
      ['加入可借阅库存', '核对完成后分配书架位置，读者现在可以找到这些图书。']
    ];
    document.querySelectorAll('[data-stage]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-stage]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        const [title, text] = stages[Number(button.dataset.stage)];
        document.querySelector('#stage-title').textContent = title;
        document.querySelector('#stage-text').textContent = text;
      });
    });
  </script>
</body>
</html>
